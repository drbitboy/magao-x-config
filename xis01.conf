# xis01.conf -- xindiserver instance "xis01", running on magaox01
#
# Local drivers only. No remote/tunneled INDI connections here --
# cross-host device linking (a01 <-> c02, b01 <-> d02) is handled by
# the separate "safer" store-and-forward application, not by
# xindiserver's own remote-driver/SSH-tunnel chaining.

local=a01,b01
